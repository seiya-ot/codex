<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Verification Workbench</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="shell">
    <section class="hero"><div><p class="eyebrow">IIJ ID Governance Administration</p><h1>API Verification Workbench</h1><p class="lead">自然言語の依頼から API を検索し、リクエストの組み立てと実行結果の確認を一つの画面で行えます。</p></div><div class="stats" id="overviewCards"></div></section>
    <section class="panel two-column">
      <div><h2>接続設定</h2><label>テナント URL<input id="baseUrl" type="url" placeholder="https://example.igms.iij.jp"></label><label>アクセストークン<input id="accessToken" type="password" placeholder="Bearer の後ろの値を入力"></label><label>Proxy URL（任意）<input id="proxyUrl" type="url" placeholder="http://proxy.example.local:8080"></label><div class="inline-grid"><label>タイムアウト（秒）<input id="timeoutSeconds" type="number" min="5" max="180" step="1" value="30"></label><label>プロキシモード<select id="proxyMode"><option value="system">システムプロキシ</option><option value="explicit">Proxy URL を使用</option><option value="disabled">プロキシを使用しない</option></select></label></div></div>
      <div><h2>依頼内容</h2><label>やりたいこと<textarea id="requestText" rows="5" placeholder="例：指定したメンバー ID の所属組織を確認したい"></textarea></label><div class="actions"><button id="resolveButton" class="primary">候補を検索</button><button id="refreshButton">マニュアルを再読込</button></div></div>
    </section>
    <section class="panel"><div class="section-head"><h2>候補 API</h2><span id="candidateMeta" class="subtle"></span></div><div id="candidates" class="candidate-list"></div></section>
    <section class="panel two-column">
      <div><h2>リクエストの編集</h2><label>Operation ID<input id="operationId" type="text" placeholder="候補を選択すると入力されます"></label><div class="inline-grid"><label>Method<input id="method" type="text" placeholder="GET"></label><label>Path<input id="path" type="text" placeholder="/api/v22.10/query"></label></div><div class="inline-grid"><label>Content-Type<input id="contentType" type="text" placeholder="application/json"></label><label>Body 形式<select id="bodyFormat"><option value="json">JSON / text</option><option value="multipart">multipart form-data</option><option value="base64">base64 binary</option></select></label></div>
        <section id="queryBuilder" class="query-builder" hidden>
          <div class="section-head"><div><h3>Query API リクエストビルダー</h3><p class="subtle">入力内容は実行時に URL パラメータと JSON body へ反映されます。</p></div><button id="resetQueryBuilderButton" type="button">初期値に戻す</button></div>
          <div class="inline-grid query-parameters"><label>情報取得日（baseDate）<input id="queryBaseDate" type="date"></label><label>対象種別（entityType）<select id="queryEntityType"><option value="member">member（従業員）</option><option value="company">company（会社）</option><option value="office">office（事業所）</option><option value="organization">organization（組織）</option><option value="project">project（プロジェクト）</option></select></label><label>検索開始日（from）<input id="queryFrom" type="date"></label><label>検索終了日（to）<input id="queryTo" type="date"></label></div>
          <label>クエリ種別<select id="queryType"><option value="AttributeQuery">属性条件（AttributeQuery）</option><option value="Logical">複合条件（Logical）</option><option value="DiffQuery">差分条件（DiffQuery）</option></select></label>
          <div id="attributeQueryFields" class="query-fields"><div class="inline-grid"><label>項目 ID<input id="queryAttributeId" type="text" placeholder="例: z6JbmwvYQcO5BKnec_FVAA"></label><label>比較演算子<select id="queryComparisonOperator"><option value="EQ">EQ（等しい）</option><option value="NE">NE（等しくない）</option><option value="CONTAINS">CONTAINS（含む）</option><option value="STARTSWITH">STARTSWITH（前方一致）</option><option value="ENDSWITH">ENDSWITH（後方一致）</option><option value="ISNULL">ISNULL（未設定）</option><option value="ISNOTNULL">ISNOTNULL（設定済み）</option></select></label></div><label>比較値（comparisonValue）<input id="queryComparisonValue" type="text" placeholder="例: 田中"></label><label>参照 ID（referenceIds、1 行に 1 件）<textarea id="queryReferenceIds" rows="3" placeholder="参照型の属性を絞り込む場合に入力"></textarea></label><label class="checkbox-label"><input id="queryOnlyLatestData" type="checkbox"> 最新データのみに限定する（onlyLatestData）</label></div>
          <div id="logicalQueryFields" class="query-fields" hidden><div class="inline-grid"><label>結合演算子<select id="queryLogicalOperator"><option value="AND">AND</option><option value="OR">OR</option></select></label><label>条件 JSON 配列<textarea id="queryLogicalConditions" rows="7" placeholder='[{"type":"AttributeQuery","condition":{"attributeId":"...","comparisonOperator":"EQ","comparisonValue":"...","referenceIds":[]}}]'></textarea></label></div><p class="subtle">各要素には AttributeQuery / Logical / DiffQuery を指定できます。</p></div>
          <div id="diffQueryFields" class="query-fields" hidden><div class="inline-grid"><label>差分対象項目 ID<input id="queryDiffAttributeId" type="text"></label><label>検索期間を適用する側<select id="queryIntervalTarget"><option value="TO">TO</option><option value="FROM">FROM</option></select></label><label>変更種別<select id="queryDiffType"><option value="IN">IN（追加・変更）</option><option value="OUT">OUT（削除・変更）</option></select></label><label>変更前の比較演算子<select id="queryDiffFromOperator"><option value="ISNULL">ISNULL</option><option value="ISNOTNULL">ISNOTNULL</option><option value="EQ">EQ</option></select></label><label>変更前の比較値<input id="queryDiffFromValue" type="text"></label><label>変更後の比較演算子<select id="queryDiffToOperator"><option value="ISNOTNULL">ISNOTNULL</option><option value="ISNULL">ISNULL</option><option value="EQ">EQ</option></select></label><label>変更後の比較値<input id="queryDiffToValue" type="text"></label></div></div>
          <div class="inline-grid"><label>メンバー属性の取得項目 ID（attributeSelector、1 行に 1 件）<textarea id="queryAttributeSelector" rows="4" placeholder="取得したいメンバー属性の項目 ID"></textarea></label><label>グループ属性の取得項目 ID（groupAttributeSelector、1 行に 1 件）<textarea id="queryGroupAttributeSelector" rows="4" placeholder="取得したいグループ属性の項目 ID"></textarea></label></div>
          <div class="actions"><button id="applyQueryBuilderButton" type="button">Body に反映</button><button id="executeQueryButton" class="primary" type="button">Query API を実行</button></div>
        </section>
        <label>Body<textarea id="body" rows="12" placeholder='{"query":"..."}'></textarea></label></div>
      <div><h2>変数と追加ヘッダー</h2><label>Variables JSON<textarea id="variables" rows="10" placeholder='{"memberId":"abc123","attributeId":"..."}'>{}</textarea></label><label>Headers JSON<textarea id="headers" rows="8" placeholder='{"X-Custom-Header":"value"}'>{}</textarea></label><div class="actions"><button id="executeButton" class="primary">リクエストを実行</button><button id="coverageButton">網羅性を確認</button></div></div>
    </section>
    <section class="panel two-column"><div><div class="section-head"><h2>実行結果</h2><span id="executeMeta" class="subtle"></span></div><pre id="responseViewer" class="viewer">まだ実行されていません。</pre></div><div><div class="section-head"><h2>網羅性プラン</h2><span id="coverageMeta" class="subtle"></span></div><div id="coverageSummary" class="coverage-summary"></div><div id="coverageItems" class="coverage-list"></div></div></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
